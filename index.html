<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>제주 카페·맛집 지도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <style>
        :root {
            --bg: #f6f5f1; --card: #fff; --text: #26302c; --muted: #6a746f; --line: #e4e2da;
            --accent: #2f6f62; --accent-soft: #e4efeb; --cafe: #a0642a; --cafe-soft: #f5e9db;
            --warn: #8a6d1d; --warn-soft: #fbf3d9;
            --ok: #1f7a4d; --ok-soft: #dcf2e5; --off: #5f6b66; --off-soft: #e9ece9;
            --rest: #b4691a; --rest-soft: #fbe9d2; --closed: #b3412f; --closed-soft: #f8e1dc;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #151a1b; --card: #1e2425; --text: #e6ebe8; --muted: #98a39d; --line: #2e3637;
                --accent: #6fb7a6; --accent-soft: #22332f; --cafe: #e0a867; --cafe-soft: #3a2f21;
                --warn: #e6c766; --warn-soft: #373018;
                --ok: #6fd6a0; --ok-soft: #1d3a2b; --off: #a8b3ad; --off-soft: #2a3132;
                --rest: #f0b46a; --rest-soft: #3d3020; --closed: #f09a8a; --closed-soft: #402621;
            }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; line-height: 1.65; }
        main { max-width: 1000px; margin: 0 auto; padding: 28px 16px 64px; }
        h1 { margin: 0 0 4px; font-size: 1.55rem; }
        .sub { margin: 0; color: var(--muted); }
        .notice { margin: 14px 0; padding: 10px 14px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); font-size: .88rem; }

        .group { margin-top: 14px; }
        .group h2 { margin: 0 0 6px; font-size: .8rem; letter-spacing: .05em; color: var(--muted); }
        .chips { display: flex; flex-wrap: wrap; gap: 7px; }
        .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; font: inherit; font-size: .9rem; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
        .chip small { font-size: .75rem; color: var(--muted); }
        .chip.low small { color: var(--warn); }
        .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
        .chip.on small { color: inherit; opacity: .85; }
        @media (prefers-color-scheme: dark) { .chip.on { color: #10201c; } }
        .chip.reset { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
        button:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 8px; }
        .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
        .seg button { border: 0; background: transparent; color: var(--text); font: inherit; font-size: .9rem; padding: 6px 14px; cursor: pointer; }
        .seg button.on { background: var(--accent); color: #fff; }
        @media (prefers-color-scheme: dark) { .seg button.on { color: #10201c; } }
        .legend { color: var(--muted); font-size: .82rem; }

        #map { height: 56vh; min-height: 340px; border-radius: 14px; border: 1px solid var(--line); }
        .pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
        .pin span { transform: rotate(45deg); font-size: 15px; line-height: 1; }
        .pin.cafe { background: #c9803a; }
        .pin.food { background: #2f8f7a; }
        .pin.approx { border-style: dashed; opacity: .8; }
        .leaflet-container { font-family: inherit; }

        .panel { margin-top: 18px; }
        .panel-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline; justify-content: space-between; }
        .panel-head h2 { margin: 0; font-size: 1.2rem; }
        .panel-head h2 small { margin-left: 8px; font-size: .8rem; font-weight: normal; color: var(--muted); }
        .meta { font-size: .8rem; color: var(--muted); margin: 4px 0 12px; }
        .meta button { margin-left: 6px; font: inherit; font-size: .8rem; color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 1px 10px; cursor: pointer; }
        .err { color: var(--closed); }
        .empty { padding: 16px; border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); }

        .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
        .card { padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
        .card:hover { border-color: var(--accent); }
        .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .card h3 { margin: 0; font-size: 1.02rem; }
        .tag { display: inline-block; padding: 0 9px; font-size: .74rem; border-radius: 999px; margin: 4px 0 6px; }
        .tag.cafe { background: var(--cafe-soft); color: var(--cafe); }
        .tag.food { background: var(--accent-soft); color: var(--accent); }
        .addr { margin: 0 0 4px; font-size: .84rem; color: var(--muted); }
        .desc { margin: 0 0 6px; font-size: .9rem; }
        .hint { margin: 0 0 6px; font-size: .78rem; color: var(--warn); }
        .info { margin: 0 0 6px; font-size: .86rem; }
        .card a, .pop a { font-size: .8rem; color: var(--accent); }

        .badge { display: inline-flex; align-items: center; gap: 5px; flex: none; padding: 1px 10px; font-size: .78rem; font-weight: 700; border-radius: 999px; white-space: nowrap; }
        .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .badge.s-open { background: var(--ok-soft); color: var(--ok); }
        .badge.s-end, .badge.s-unknown, .badge.s-wait { background: var(--off-soft); color: var(--off); }
        .badge.s-rest { background: var(--rest-soft); color: var(--rest); }
        .badge.s-closed { background: var(--closed-soft); color: var(--closed); }
        .badge.s-load::before { animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: .25; } }

        .maplinks { display: inline-flex; gap: 10px; margin-right: 10px; }
        .pop { min-width: 190px; }
        .pop h4 { margin: 0 0 4px; font-size: 1rem; }
        .pop p { margin: 2px 0; font-size: .85rem; }
    </style>
</head>
<body>
<main>
    <h1>☕🍜 제주 카페·맛집 지도</h1>
    <p class="sub">동을 누르면 지도가 그 동으로 확대되고 카페와 맛집이 표시돼요.</p>

    <div class="notice" id="notice"></div>

    <div id="chipArea"></div>

    <div class="bar">
        <div class="seg" id="catSeg"></div>
        <span class="legend">☕ 카페 · 🍽️ 음식점 · 점선 핀은 정확한 위치를 못 찾아 동 근처에 둔 곳</span>
    </div>

    <div id="map"></div>

    <section class="panel" id="panel"></section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const data = JSON.parse(document.getElementById("data").textContent)
    const items = data.items

    const DONGS = [
        ["제주시", ["일도1동", "일도2동", "이도1동", "이도2동", "삼도1동", "삼도2동", "용담1동", "용담2동", "건입동", "화북동", "삼양동", "봉개동", "아라동", "오라동", "연동", "노형동", "외도동", "이호동", "도두동"]],
        ["서귀포시", ["송산동", "정방동", "중앙동", "천지동", "효돈동", "영천동", "동홍동", "서홍동", "대륜동", "대천동", "중문동", "예래동"]]
    ]
    const GOAL = 5
    const JEJU = [33.38, 126.55]
    const areaOf = {}
    DONGS.forEach(([a, list]) => list.forEach(d => areaOf[d] = a))

    const emptyDongs = Object.keys(areaOf).filter(d => !items.some(i => i.dong === d))
    document.getElementById("notice").textContent =
        `총 ${items.length}곳 (목표: 동마다 ${GOAL}곳). 검색에서 근거가 확인된 곳만 담아서 모자란 동이 있어요` +
        (emptyDongs.length ? ` (확인된 곳 없음: ${emptyDongs.join(", ")})` : "") +
        `. 영업 상태는 Gemini가 구글 검색으로 확인한 정보라 틀릴 수 있으니, 가기 전에 지도 앱에서 한 번 더 확인하세요.`

    // ---------- 위치 계산 ----------
    function centerOf(dong) {
        const c = data.dongCenters && data.dongCenters[dong]
        if (c) return [c.lat, c.lng]
        const located = items.filter(i => i.dong === dong && i.lat != null)
        if (located.length) {
            return [located.reduce((s, i) => s + i.lat, 0) / located.length, located.reduce((s, i) => s + i.lng, 0) / located.length]
        }
        return JEJU
    }
    // 위치를 못 찾은 가게는 동 중심 둘레에 나눠서 놓는다. (겹치지 않게)
    DONGS.forEach(([, list]) => list.forEach(dong => {
        const mine = items.filter(i => i.dong === dong)
        const lost = mine.filter(i => i.lat == null)
        const c = centerOf(dong)
        mine.forEach(i => {
            if (i.lat != null) { i._pos = [i.lat, i.lng]; i._approx = false; return }
            const k = lost.indexOf(i)
            const ang = (2 * Math.PI * k) / Math.max(lost.length, 1)
            i._pos = [c[0] + 0.003 * Math.sin(ang), c[1] + 0.003 * Math.cos(ang) / Math.cos(c[0] * Math.PI / 180)]
            i._approx = true
        })
    }))

    // ---------- 상태 ----------
    let selected = null      // 선택한 동 (null 이면 전체)
    let cat = "전체"
    const statuses = {}      // 동 -> { state: 'loading'|'ok'|'error', map, checkedAt, error }
    let openItem = null

    const map = L.map("map", { worldCopyJump: false }).setView(JEJU, 10)
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map)
    const layer = L.layerGroup().addTo(map)
    const markerOf = new Map()

    const visible = (dong) => items.filter(i => (!dong || i.dong === dong) && (cat === "전체" || i.category === cat))

    // ---------- 영업 상태 표시 ----------
    const STATUS_CLASS = { "영업중": "s-open", "영업종료": "s-end", "휴무": "s-rest", "폐업": "s-closed", "확인불가": "s-unknown" }
    function statusOf(item) {
        const rec = statuses[item.dong]
        if (!rec) return { label: "확인 전", cls: "s-wait" }
        if (rec.state === "loading") return { label: "확인 중...", cls: "s-wait s-load" }
        if (rec.state === "error") return { label: "확인 못 함", cls: "s-unknown" }
        const p = rec.map[item.name]
        return p ? { label: p.status, cls: STATUS_CLASS[p.status] || "s-unknown", hours: p.hours, note: p.note } : { label: "확인불가", cls: "s-unknown" }
    }
    function badge(item) {
        const s = statusOf(item)
        const b = document.createElement("span")
        b.className = "badge " + s.cls
        b.textContent = s.label
        return b
    }
    function infoLine(item) {
        const s = statusOf(item)
        const parts = []
        if (s.hours) parts.push("오늘 " + s.hours)
        if (s.note) parts.push(s.note)
        return parts.join(" · ")
    }

    // 정확한 위치는 지도 앱에서 확인하도록 이름+주소로 검색하는 링크를 만든다.
    function mapLinks(item) {
        const q = encodeURIComponent(item.name + " " + (item.address || item.dong))
        const wrap = document.createElement("span")
        wrap.className = "maplinks"
        ;[["구글지도", "https://www.google.com/maps/search/?api=1&query=" + q], ["네이버지도", "https://map.naver.com/p/search/" + q]].forEach(([label, href]) => {
            const a = document.createElement("a")
            a.href = href
            a.target = "_blank"
            a.rel = "noopener noreferrer"
            a.textContent = label
            a.addEventListener("click", e => e.stopPropagation())
            wrap.appendChild(a)
        })
        return wrap
    }

    // ---------- 지도 ----------
    function popupOf(item) {
        const box = document.createElement("div")
        box.className = "pop"
        const h = document.createElement("h4")
        h.textContent = item.name
        const line1 = document.createElement("p")
        line1.append(badge(item))
        box.append(h, line1)
        const info = infoLine(item)
        if (info) { const p = document.createElement("p"); p.textContent = info; box.appendChild(p) }
        const addr = document.createElement("p")
        addr.textContent = item.address || ""
        const desc = document.createElement("p")
        desc.textContent = item.description || ""
        box.append(addr, desc, mapLinks(item))
        if (item._approx) { const p = document.createElement("p"); p.textContent = "※ 정확한 위치를 못 찾아 동 근처에 표시했어요."; p.className = "hint"; box.appendChild(p) }
        return box
    }

    function drawMarkers() {
        layer.clearLayers()
        markerOf.clear()
        visible(selected).forEach(item => {
            const icon = L.divIcon({
                className: "",
                html: `<div class="pin ${item.category === "카페" ? "cafe" : "food"}${item._approx ? " approx" : ""}"><span>${item.category === "카페" ? "☕" : "🍽️"}</span></div>`,
                iconSize: [30, 30], iconAnchor: [4, 30], popupAnchor: [11, -28]
            })
            const m = L.marker(item._pos, { icon, title: item.name }).addTo(layer)
            m.bindPopup(() => popupOf(item))
            m.on("popupopen", () => { openItem = item })
            m.on("popupclose", () => { if (openItem === item) openItem = null })
            markerOf.set(item, m)
        })
    }

    function zoomTo(dong) {
        if (!dong) { map.flyTo(JEJU, 10, { duration: 0.8 }); return }
        const pts = visible(dong).map(i => i._pos)
        const maxZ = visible(dong).every(i => i._approx) ? 15 : 16
        if (pts.length >= 2) map.flyToBounds(L.latLngBounds(pts), { padding: [60, 60], maxZoom: maxZ, duration: 0.8 })
        else if (pts.length === 1) map.flyTo(pts[0], maxZ, { duration: 0.8 })
        else map.flyTo(centerOf(dong), 15, { duration: 0.8 })
    }

    // ---------- 동 칩 ----------
    function renderChips() {
        const area = document.getElementById("chipArea")
        area.textContent = ""
        const resetGroup = document.createElement("div")
        resetGroup.className = "chips"
        const reset = document.createElement("button")
        reset.type = "button"
        reset.className = "chip reset"
        reset.textContent = "🗺️ 제주 전체 보기"
        reset.addEventListener("click", () => select(null))
        resetGroup.appendChild(reset)
        area.appendChild(resetGroup)

        DONGS.forEach(([areaName, list]) => {
            const g = document.createElement("div")
            g.className = "group"
            const h = document.createElement("h2")
            h.textContent = areaName
            const chips = document.createElement("div")
            chips.className = "chips"
            list.forEach(dong => {
                const n = items.filter(i => i.dong === dong).length
                const b = document.createElement("button")
                b.type = "button"
                b.className = "chip" + (n < GOAL ? " low" : "") + (dong === selected ? " on" : "")
                b.append(document.createTextNode(dong + " "))
                const sm = document.createElement("small")
                sm.textContent = n + "곳"
                b.appendChild(sm)
                b.addEventListener("click", () => select(dong))
                chips.appendChild(b)
            })
            g.append(h, chips)
            area.appendChild(g)
        })
    }

    // ---------- 선택한 동 카드 ----------
    function renderPanel() {
        const panel = document.getElementById("panel")
        panel.textContent = ""
        if (!selected) {
            const p = document.createElement("p")
            p.className = "empty"
            p.textContent = "위에서 동을 하나 눌러 보세요. 지도가 그 동으로 확대되고, 카페·맛집과 영업 상태가 나와요."
            panel.appendChild(p)
            return
        }
        const list = visible(selected)
        const head = document.createElement("div")
        head.className = "panel-head"
        const h = document.createElement("h2")
        h.textContent = selected
        const sm = document.createElement("small")
        sm.textContent = areaOf[selected] + " · " + items.filter(i => i.dong === selected).length + "곳"
        h.appendChild(sm)
        head.appendChild(h)
        panel.appendChild(head)

        const rec = statuses[selected]
        const meta = document.createElement("div")
        meta.className = "meta"
        if (!rec) meta.textContent = "영업 상태를 아직 확인하지 않았어요."
        else if (rec.state === "loading") meta.textContent = "Gemini가 구글 검색으로 영업 상태를 확인하고 있어요..."
        else if (rec.state === "ok") meta.textContent = "Gemini가 구글 검색으로 확인한 정보예요 (" + rec.checkedAt + " 기준)."
        else { meta.className = "meta err"; meta.textContent = "영업 상태를 확인하지 못했어요: " + rec.error }
        if (items.some(i => i.dong === selected) && (!rec || rec.state !== "loading")) {
            const b = document.createElement("button")
            b.type = "button"
            b.textContent = rec && rec.state === "ok" ? "다시 확인" : "영업 상태 확인"
            b.addEventListener("click", () => checkDong(selected, true))
            meta.appendChild(b)
        }
        panel.appendChild(meta)

        if (list.length === 0) {
            const e = document.createElement("div")
            e.className = "empty"
            e.textContent = items.some(i => i.dong === selected) ? "이 종류의 가게는 아직 없어요." : "검색에서 확인된 곳이 아직 없어요."
            panel.appendChild(e)
            return
        }

        const grid = document.createElement("div")
        grid.className = "cards"
        list.forEach(item => {
            const card = document.createElement("div")
            card.className = "card"
            const top = document.createElement("div")
            top.className = "top"
            const name = document.createElement("h3")
            name.textContent = item.name
            top.append(name, badge(item))
            const tag = document.createElement("span")
            tag.className = "tag " + (item.category === "카페" ? "cafe" : "food")
            tag.textContent = item.category
            card.append(top, tag)

            const info = infoLine(item)
            if (info) { const p = document.createElement("p"); p.className = "info"; p.textContent = "🕒 " + info; card.appendChild(p) }
            const addr = document.createElement("p")
            addr.className = "addr"
            addr.textContent = item.address || ""
            const desc = document.createElement("p")
            desc.className = "desc"
            desc.textContent = item.description || ""
            card.append(addr, desc)
            if (item._approx) { const p = document.createElement("p"); p.className = "hint"; p.textContent = "정확한 위치를 못 찾아 동 근처에 표시했어요."; card.appendChild(p) }
            card.appendChild(mapLinks(item))
            if (/^https?:\/\//.test(item.source || "")) {
                const a = document.createElement("a")
                a.href = item.source
                a.target = "_blank"
                a.rel = "noopener noreferrer"
                a.textContent = "출처 보기"
                a.addEventListener("click", e => e.stopPropagation())
                card.appendChild(a)
            }
            card.addEventListener("click", () => {
                const m = markerOf.get(item)
                if (!m) return
                map.flyTo(item._pos, 17, { duration: 0.6 })
                m.openPopup()
                document.getElementById("map").scrollIntoView({ behavior: "smooth", block: "center" })
            })
            grid.appendChild(card)
        })
        panel.appendChild(grid)
    }

    // ---------- Gemini 영업 상태 ----------
    async function checkDong(dong, force) {
        const rec = statuses[dong]
        if (rec && (rec.state === "loading" || (rec.state === "ok" && !force))) return
        const places = items.filter(i => i.dong === dong).map(i => ({ name: i.name, address: i.address }))
        if (places.length === 0) return

        statuses[dong] = { state: "loading" }
        refresh(false)
        try {
            const res = await fetch("/api/place_status", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ dong, places })
            })
            const j = await res.json().catch(() => ({}))
            if (!res.ok) throw new Error(j.error || "서버 응답 오류 (" + res.status + ")")
            statuses[dong] = { state: "ok", checkedAt: j.checkedAt, map: Object.fromEntries(j.places.map(p => [p.name, p])) }
        } catch (err) {
            const offline = location.protocol === "file:" || err instanceof TypeError
            statuses[dong] = { state: "error", error: offline ? "Vercel에 배포된 주소에서만 확인할 수 있어요." : err.message }
        }
        refresh(false)
        if (openItem && markerOf.get(openItem)) markerOf.get(openItem).setPopupContent(popupOf(openItem))
    }

    // ---------- 전체 갱신 ----------
    function refresh(redrawMap) {
        renderChips()
        renderPanel()
        if (redrawMap) drawMarkers()
    }

    function select(dong) {
        selected = dong
        refresh(true)
        zoomTo(dong)
        if (dong) checkDong(dong, false)
    }

    // 종류 필터
    const catBox = document.getElementById("catSeg")
    ;["전체", "카페", "음식점"].forEach(name => {
        const b = document.createElement("button")
        b.type = "button"
        b.textContent = name
        b.addEventListener("click", () => {
            cat = name
            ;[...catBox.children].forEach(x => x.classList.toggle("on", x.textContent === cat))
            refresh(true)
            if (selected) zoomTo(selected)
        })
        catBox.appendChild(b)
    })
    catBox.children[0].classList.add("on")

    refresh(true)
</script>
</body>
</html>
